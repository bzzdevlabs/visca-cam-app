<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Tenveo PTZ application icon: a PTZ camera head on its base, Fluent style.
       Flat colours only, so any SVG renderer (including ImageMagick's) draws it correctly.
       Rebuild the .ico with:
       magick -background none -density 384 app-icon.svg -define icon:auto-resize=256,64,48,32,24,16 app-icon.ico -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#0F6CBD"/>
  <rect x="8" y="128" width="240" height="120" rx="52" fill="#115EA3"/>
  <rect x="8" y="128" width="240" height="40" fill="#115EA3"/>
  <rect x="78" y="186" width="100" height="24" rx="12" fill="#DCE9F5"/>
  <rect x="117" y="150" width="22" height="44" rx="6" fill="#DCE9F5"/>
  <rect x="48" y="60" width="160" height="100" rx="44" fill="#FFFFFF"/>
  <circle cx="128" cy="110" r="36" fill="#0F548C"/>
  <circle cx="128" cy="110" r="23" fill="#1B2A3A"/>
  <circle cx="139" cy="99" r="8" fill="#9FD0FF"/>
</svg>
