name: CI

on:
  pull_request:
    paths-ignore: # Documentation only: built and published by docs.yml.
      - website/**
      - '**.md'
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # Write access is only used by the screenshots job (ci-screenshots branch).
    permissions:
      contents: write
