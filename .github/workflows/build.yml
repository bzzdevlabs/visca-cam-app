name: Build

# Reusable: builds, tests and smoke-tests the app on Windows, then uploads it as an artifact.
on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the assemblies (major.minor.patch).
        type: string
        required: true
    outputs:
      artifact:
        description: Name of the uploaded application artifact.
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact: TenveoPTZ-${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ inputs.version }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Smoke test (start the app and check its window)
        shell: pwsh
        run: ./build/smoke-test.ps1 -Exe src/TenveoPtz.App/bin/Release/net48/TenveoPTZ.exe -Screenshot dist/screenshot.png

      - name: Collect application files
        shell: pwsh
        run: |
          $bin = "src/TenveoPtz.App/bin/Release/net48"
          New-Item -ItemType Directory -Force dist/TenveoPTZ | Out-Null
          Copy-Item "$bin/TenveoPTZ.exe", "$bin/TenveoPTZ.exe.config", "$bin/TenveoPtz.Core.dll", README.md -Destination dist/TenveoPTZ

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: TenveoPTZ-${{ inputs.version }}
          path: dist/TenveoPTZ/
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.version }}
          path: dist/*.png
          if-no-files-found: ignore
