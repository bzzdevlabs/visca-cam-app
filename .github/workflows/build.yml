name: Build

# Reusable: computes the version, builds, tests and smoke-tests the app on Windows, then uploads it.
on:
  workflow_call:
    outputs:
      version:
        description: Version of this build (major.minor.patch.build).
        value: ${{ jobs.build.outputs.version }}
      release:
        description: Whether the commits since the last release warrant a new release.
        value: ${{ jobs.build.outputs.release }}
      artifact:
        description: Name of the uploaded application artifact.
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      artifact: TenveoPTZ-${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tags and full history are needed to compute the version.

      - name: Compute version
        id: version
        shell: bash
        run: |
          output="$(bash build/version.sh)"
          echo "$output"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "**Version:** $(sed -n 's/^version=//p' <<<"$output")" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Smoke test (start the app and check its window)
        shell: pwsh
        run: ./build/smoke-test.ps1 -Exe src/TenveoPtz.App/bin/Release/net48/TenveoPTZ.exe -ScreenshotDir dist -SamplePresets

      - name: Collect application files
        shell: pwsh
        run: |
          $bin = "src/TenveoPtz.App/bin/Release/net48"
          New-Item -ItemType Directory -Force dist/TenveoPTZ | Out-Null
          Copy-Item "$bin/TenveoPTZ.exe", "$bin/TenveoPTZ.exe.config", "$bin/TenveoPtz.Core.dll", README.md -Destination dist/TenveoPTZ

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: TenveoPTZ-${{ steps.version.outputs.version }}
          path: dist/TenveoPTZ/
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ steps.version.outputs.version }}
          path: dist/*.png
          if-no-files-found: ignore
