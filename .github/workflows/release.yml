name: Release

# Runs when a pull request is merged (push to main). The build computes the version
# major.minor.patch.build from the Conventional Commits since the last tag (feat: minor,
# fix/perf: patch, breaking: major) and the commit count. Merges containing only docs, ci,
# chore, test... are built and tested but not released.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # Write access is only used by the screenshots job (ci-screenshots branch).
    permissions:
      contents: write

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: TenveoPTZ

      - name: Zip application
        run: cd TenveoPTZ && zip -r "../TenveoPTZ-$VERSION.zip" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running the job replaces the asset instead of failing on the existing release.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "TenveoPTZ-$VERSION.zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" "TenveoPTZ-$VERSION.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Tenveo PTZ $VERSION" \
              --generate-notes
          fi
